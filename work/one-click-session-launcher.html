<div id="one-click-sessions" class="viz-dotted-background">
  <section class="launcher" aria-labelledby="one-click-sessions-title">
    <header class="launcher-header">
      <h2 id="one-click-sessions-title">New session</h2>
    </header>
    <table class="launch-table" aria-label="Start a session by model and effort">
      <tbody></tbody>
    </table>
    <p class="launch-status" role="status"></p>
  </section>
</div>

<style>
  #one-click-sessions {
    display: grid;
    justify-items: center;
    padding: 44px 16px 36px;
  }

  #one-click-sessions .launcher {
    --panel: light-dark(#fff, #151a23);
    --edge: light-dark(#dce3ee, #2b3444);
    --ink: light-dark(#192435, #edf2fa);
    --secondary-ink: light-dark(#506079, #a6b3c9);
    --button: light-dark(#edf3ff, #1d2b44);
    --button-edge: light-dark(#dce7fc, #2a3d5c);
    --button-ink: light-dark(#234ba4, #c5d8ff);
    --button-accent: light-dark(#3f67bb, #90b0f1);
    --launch: #3260cc;
    --launch-ink: #fff;
    --radius: 14px;
    box-sizing: border-box;
    width: min(100%, 452px);
    position: relative;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px light-dark(#2438531a, #0005);
    font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 0 14px 13px;
  }

  #one-click-sessions .launcher-header {
    padding: 14px 2px 11px;
    border-bottom: 1px solid var(--edge);
    margin-bottom: 5px;
  }

  #one-click-sessions h2 {
    margin: 0;
    color: inherit;
    font: 650 16px/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #one-click-sessions .launch-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 4px;
    table-layout: fixed;
  }

  #one-click-sessions th {
    width: 79px;
    padding: 0 6px 0 2px;
    text-align: start;
    font-weight: 600;
    color: var(--ink);
  }

  #one-click-sessions td { padding: 0 0 0 5px; }

  #one-click-sessions .launch-choice {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    min-height: 36px;
    padding: 0 4px;
    background: var(--button);
    color: var(--button-ink);
    border: 1px solid var(--button-edge);
    border-radius: max(4px, calc(var(--radius) - 7px));
    font: 550 13px/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #one-click-sessions .launch-choice :is(i, svg) {
    display: inline-grid;
    place-items: center;
    width: 13px;
    height: 13px;
    font: normal 16px/1 system-ui, sans-serif;
    color: var(--button-accent);
  }

  #one-click-sessions .launch-choice:is(:hover, :focus-visible) {
    background: var(--launch);
    border-color: var(--launch);
    color: var(--launch-ink);
  }

  #one-click-sessions .launch-choice:is(:hover, :focus-visible) :is(i, svg) { color: inherit; }

  #one-click-sessions .launch-choice:focus-visible {
    outline: 2px solid var(--button-accent);
    outline-offset: 2px;
  }

  #one-click-sessions .launch-status {
    position: absolute;
    inset-inline: 1px;
    top: 100%;
    margin: 7px 0 0;
    color: var(--secondary-ink);
    font-size: 12px;
  }

  @media (max-width: 390px) {
    #one-click-sessions { padding-inline: 10px; }
    #one-click-sessions .launcher { padding-inline: 10px; }
    #one-click-sessions th { width: 60px; }
    #one-click-sessions .launch-choice { gap: 3px; }
  }

  @media (pointer: coarse) {
    #one-click-sessions .launch-table { border-spacing: 0 5px; }
    #one-click-sessions .launch-choice { min-width: 44px; min-height: 44px; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('one-click-sessions');
  const launcher = root.querySelector('.launcher');
  const table = root.querySelector('tbody');
  const status = root.querySelector('.launch-status');
  const models = ['Astra', 'Sol', 'Luna', 'Sonnet', 'Opus', 'Fable'];
  const efforts = ['Low', 'Mid', 'High'];

  table.innerHTML = models.map(model => `
    <tr>
      <th scope="row">${model}</th>
      ${efforts.map(effort => `
        <td>
          <button class="launch-choice cursor-interaction" type="button" data-model="${model}" data-effort="${effort}" aria-label="Start a session with ${model} at ${effort.toLowerCase()} effort">
            <i data-lucide="plus" aria-hidden="true">+</i><span>${effort}</span>
          </button>
        </td>`).join('')}
    </tr>`).join('');

  table.addEventListener('click', event => {
    const button = event.target.closest('.launch-choice');
    if (!button) return;
    const { model, effort } = button.dataset;
    status.textContent = `Session preview · ${model} · ${effort} effort`;
  });

  const design = { radius: 14 };
  if (globalThis.Tweak) {
    const tweak = new Tweak({
      container: launcher,
      onChange() { launcher.style.setProperty('--radius', `${design.radius}px`); },
    });
    tweak.addSlider(design, 'radius', { label: 'Corner radius', min: 4, max: 24, unit: 'px' });
  }

  globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
})();
</script>
