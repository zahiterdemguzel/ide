<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f5fa"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000000" fill-opacity=".05"/></pattern>
    <radialGradient id="glow" cx=".22" cy=".5" r=".45"><stop offset="0" stop-color="#24a873" stop-opacity=".18"/><stop offset="1" stop-color="#24a873" stop-opacity="0"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="-5" dy="2" stdDeviation="5" flood-opacity=".3"/></filter>
    <style>
      .spin { transform-origin: 1074px 300px; animation: r 1.1s linear infinite; }
      @keyframes r { to { transform: rotate(360deg); } }
      .pulse { animation: p 1.8s ease-in-out infinite; }
      @keyframes p { 50% { opacity: .35; } }
    </style>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>
  <g transform="translate(120 88) scale(1.9)">
    <rect x="14" y="16" width="62" height="52" rx="6" fill="#24a873"/>
    <rect x="29" y="36" width="62" height="52" rx="6" fill="#eba41f" filter="url(#s)"/>
    <rect x="44" y="56" width="62" height="52" rx="6" fill="#e84235" filter="url(#s)"/>
  </g>
  <text x="400" y="170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#1f2328" letter-spacing="-2">IDE</text>
  <text x="402" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#57606a">Run many Claude Code sessions side by side.</text>
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="20" fill="#1f2328">
    <rect x="402" y="276" width="190" height="48" rx="24" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="428" cy="300" r="8" fill="#3fb950" class="pulse"/><text x="446" y="307">needs you</text>
    <rect x="608" y="276" width="170" height="48" rx="24" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="634" cy="300" r="8" fill="#3fb950"/><text x="652" y="307">done</text>
    <rect x="794" y="276" width="170" height="48" rx="24" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="820" cy="300" r="8" fill="#a371f7"/><text x="838" y="307">pushed</text>
    <rect x="980" y="276" width="200" height="48" rx="24" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="1074" cy="300" r="8" fill="none" stroke="#d29922" stroke-opacity=".3" stroke-width="3" transform="translate(-68 0)"/>
    <g transform="translate(-68 0)"><path class="spin" d="M1074 292 a8 8 0 0 1 8 8" fill="none" stroke="#d29922" stroke-width="3" stroke-linecap="round"/></g>
    <text x="1028" y="307">working</text>
  </g>
</svg>
